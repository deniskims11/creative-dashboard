name: Deploy to GitHub Pages

# Every run pulls fresh data from the Triple Whale SQL API (when the TW_API_KEY
# secret is set), rebuilds the manifest and publishes. Without the secret it
# deploys the committed public/data/latest.json as before.
on:
  push:
    branches: [main]
  schedule:
    # Every 4 hours. Each run re-pulls the whole window, so yesterday's late
    # Triple Whale attribution settles in and today's partial day stays current.
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh data from Triple Whale
        env:
          TW_API_KEY: ${{ secrets.TW_API_KEY }}
        run: |
          if [ -z "$TW_API_KEY" ]; then
            echo "::notice::TW_API_KEY not set — deploying the committed data."
          else
            python3 scripts/fetch_tw_sql.py --days 120
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and this repo never commits data. Touch a heartbeat file every
  # ~3 weeks so the 4-hourly refresh keeps running.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit heartbeat if stale
        run: |
          f=.github/heartbeat
          last=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
          last=${last:-0}
          if [ $(( $(date +%s) - last )) -gt $(( 21 * 86400 )) ]; then
            date -u +%Y-%m-%dT%H:%MZ > "$f"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$f" && git commit -m "chore: keep scheduled refresh alive" && git push
          else
            echo "heartbeat fresh"
          fi
